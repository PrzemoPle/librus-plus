name: MojLibrus

options:
  bundleIdPrefix: pl.plewinscy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  MojLibrus:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "Widget"
          - "Widget/**"
      - path: Resources
        excludes:
          - "Info.plist"
          - "Widget"
          - "Widget/**"
          - "*.entitlements"
    dependencies:
      - target: MojLibrusWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.plewinscy.dzienniczek
        PRODUCT_NAME: MojLibrus
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/MojLibrus.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        CLANG_ENABLE_MODULES: "YES"
        # Signing is per target (the widget has its own profile); the CI turns it
        # on with CODE_SIGNING_ALLOWED=YES only for the TestFlight archive.
        DEVELOPMENT_TEAM: 94MSU24AZ7
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "Dzienniczek App Store"

  MojLibrusWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.plewinscy.dzienniczek.widget
        PRODUCT_NAME: MojLibrusWidget
        INFOPLIST_FILE: Resources/Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/MojLibrusWidget.entitlements
        GENERATE_INFOPLIST_FILE: "NO"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: "YES"
        DEVELOPMENT_TEAM: 94MSU24AZ7
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "Dzienniczek Widget App Store"

  MojLibrusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/MojLibrusTests
    dependencies:
      - target: MojLibrus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pl.plewinscy.dzienniczek.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MojLibrus.app/MojLibrus"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  MojLibrus:
    build:
      targets:
        MojLibrus: all
        MojLibrusWidget: all
        MojLibrusTests: [test]
    test:
      targets:
        - MojLibrusTests
    run:
      config: Debug
    archive:
      config: Release
