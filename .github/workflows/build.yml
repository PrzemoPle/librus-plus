name: build

# Compile + unit-test check on every push (unsigned build, artifact only).
# The signed TestFlight build lives in testflight.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # macOS 26 image — the only one carrying Xcode 26 (iOS 26 SDK). Building
    # against that SDK is what turns Liquid Glass on for the system chrome, and
    # it is required for every explicit glass API. macos-14 tops out at Xcode 16.2.
    runs-on: macos-26
    timeout-minutes: 30
    env:
      SCHEME: MojLibrus
      APP_NAME: MojLibrus
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Compute version
        id: ver
        run: |
          BUILD=$(( GITHUB_RUN_NUMBER + 1000 ))
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            IS_TAG=1
          else
            VERSION="0.0.${BUILD}"
            IS_TAG=0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "is_tag=$IS_TAG" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (build $BUILD)"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iOS Simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          if [ -z "$UDID" ]; then echo '::error::no iOS simulator found'; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$APP_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build-test \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Build (unsigned, device)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$APP_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION=${{ steps.ver.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ steps.ver.outputs.build }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            clean build \
            | xcbeautify --renderer github-actions

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/$APP_NAME.app"
          if [ ! -d "$APP_PATH" ]; then echo "::error::$APP_PATH not found"; exit 1; fi
          echo "Built version: $(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          rm -rf Payload "$APP_NAME.ipa"
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qr "$APP_NAME.ipa" Payload
          mkdir -p dist
          mv "$APP_NAME.ipa" dist/
          ls -lh dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MojLibrus-ipa
          path: dist/MojLibrus.ipa
          if-no-files-found: error
